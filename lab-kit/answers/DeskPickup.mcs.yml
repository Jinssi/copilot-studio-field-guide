kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - Where do I pick up a loan projector?
      - Is there after-hours projector pickup?
      - Where is the projector pickup desk?
  actions:
    - kind: SendActivity
      id: sendPickup
      activity: Collect loan projectors at the Map Room. Pickup is Monday to Friday, 09:00 to 17:00 local time. No after-hours pickup.
inputType: {}
outputType: {}
